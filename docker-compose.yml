# Local development infrastructure for RepoInsight (Project 19 prototype).
# Sized for a 16 GB laptop (~3 GB total). Every port binds to 127.0.0.1 only.
name: repoinsight

services:
  mongo:
    image: mongo:8.0.12
    # Replica set (needed for transactions/outbox) with auth + internal keyfile.
    entrypoint:
      - bash
      - -c
      - |
        printf '%s' "$$MONGO_REPLICA_KEY" > /tmp/rs.key
        chmod 400 /tmp/rs.key && chown 999:999 /tmp/rs.key
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all \
          --keyFile /tmp/rs.key --wiredTigerCacheSizeGB 0.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set in .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?set in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
      MONGO_DB: ${MONGO_DB:-repoinsight}
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    # Initiates the replica set on first run, then reports healthy once PRIMARY.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
          ; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1g }
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Security plugin stays ENABLED (TLS + auth with the bundled dev certificates).
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?set in .env}
    ports: ["127.0.0.1:9200:9200"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -sfk -u "admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
          "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 1536m }
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # CLIENT: SASL/PLAIN for the app (published on loopback).
      # INTERNAL: inter-broker + admin tooling, reachable only on the compose network.
      KAFKA_LISTENERS: CLIENT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://127.0.0.1:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        user_${KAFKA_APP_USER:?set in .env}="${KAFKA_APP_PASSWORD:?set in .env}";
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:9092:9092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1g }
    restart: unless-stopped

  # One-shot: creates topics idempotently (auto-creation is disabled).
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint:
      - bash
      - -c
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh; B=kafka:19092
        $$T --bootstrap-server $$B --create --if-not-exists --topic ri.changes --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic ri.permissions --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic ri.changes.dlq --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --list
    restart: "no"

volumes:
  mongo-data:
  opensearch-data:
  kafka-data:
